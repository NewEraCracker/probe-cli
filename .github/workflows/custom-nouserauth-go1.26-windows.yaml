# Unofficial custom Windows build of OONI Probe.
# Uses the nouserauth build tag and Go 1.26.
# Cross-compiles ooniprobe.exe and miniooni.exe from Linux into /CLI and uploads them as an artifact.

name: Windows custom nouserauth build

on:
  push:
    branches:
      - "custom-nouserauth-go1.26-windows"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"

      - name: Install MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-mingw-w64-x86-64

      - name: Set Go module version
        run: go mod edit -go=1.26.0 -toolchain=none

      - name: Build Windows executables
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: |
          go build -buildvcs=false -tags="goexperiment.jsonv2,nouserauth" -v -ldflags="-s -w -extldflags=-static" -o CLI/ooniprobe.exe ./cmd/ooniprobe
          go build -buildvcs=false -tags="goexperiment.jsonv2,nouserauth" -v -ldflags="-s -w -extldflags=-static" -o CLI/miniooni.exe ./internal/cmd/miniooni

      - uses: actions/upload-artifact@v6
        with:
          name: ooniprobe-windows
          path: |
            CLI/ooniprobe.exe
            CLI/miniooni.exe
          retention-days: 90
